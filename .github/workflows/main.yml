name: Project Build & Code Quality Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Проверка на Arduino / ESP32 кода
  arduino-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 & AVR Cores
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Compile Sketch
        run: |
          # Автоматично намира всеки .ino файл в проекта и го компилира
          find . -name "*.ino" -exec arduino-cli compile --fqbn esp32:esp32:esp32-s3 {} \;

  # 2. Проверка на PHP синтаксиса (този стъпка вече работи идеално)
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP Syntax
        run: |
          find . -type f -name "*.php" -exec php -l {} \;
